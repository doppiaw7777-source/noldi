name: MemForge V5 Auto Build

"on":
  push:
    paths:
      - ".github/workflows/memforge-v5.yml"
  pull_request:
    paths:
      - ".github/workflows/memforge-v5.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf MemForgeV5 MemForgeV5.xcodeproj build Payload MemForge-V5.ipa
          mkdir -p MemForgeV5

          cat > project.yml <<'YAML'
          name: MemForgeV5
          options:
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          targets:
            MemForge:
              type: application
              platform: iOS
              sources:
                - path: MemForgeV5
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.memforge.v5
                  PRODUCT_NAME: MemForge
                  INFOPLIST_FILE: MemForgeV5/Info.plist
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTS_MACCATALYST: "NO"
                  GENERATE_INFOPLIST_FILE: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
          YAML

          cat > MemForgeV5/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>MemForge</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>5.0</string>
              <key>CFBundleVersion</key>
              <string>5</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > MemForgeV5/MemForgeApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct MemForgeApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          cat > MemForgeV5/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct MemoryMatch: Identifiable {
              let id = UUID()
              let index: Int
              var value: Int32
          }

          struct ContentView: View {
              @State private var memory: [Int32] = {
                  var values = Array(repeating: Int32(0), count: 8192)
                  values[128] = 1500
                  values[512] = 1500
                  values[1024] = 100
                  values[2048] = 7500
                  return values
              }()

              @State private var query = "1500"
              @State private var matches: [Int] = []
              @State private var status = "Engine ready"

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              VStack(alignment: .leading, spacing: 8) {
                                  Label("MemForge V5", systemImage: "memorychip")
                                      .font(.title2.bold())
                                  Text("Controlled internal memory engine")
                                      .foregroundStyle(.secondary)
                                  Text(status)
                                      .font(.caption.monospaced())
                              }
                              .padding(.vertical, 6)
                          }

                          Section("Int32 Scanner") {
                              TextField("Value", text: $query)
                                  .keyboardType(.numbersAndPunctuation)

                              Button {
                                  firstScan()
                              } label: {
                                  Label("First Scan", systemImage: "magnifyingglass")
                              }

                              Button {
                                  writeFirst()
                              } label: {
                                  Label("Write first result → 999999",
                                        systemImage: "square.and.pencil")
                              }
                              .disabled(matches.isEmpty)

                              Button(role: .destructive) {
                                  resetMemory()
                              } label: {
                                  Label("Reset Demo Memory", systemImage: "arrow.counterclockwise")
                              }
                          }

                          if !matches.isEmpty {
                              Section("Results (\(matches.count))") {
                                  ForEach(matches, id: \.self) { index in
                                      VStack(alignment: .leading, spacing: 3) {
                                          Text(String(format: "0x%08X", index * MemoryLayout<Int32>.size))
                                              .font(.system(.body, design: .monospaced))
                                          Text("Int32 = \(memory[index])")
                                              .font(.caption)
                                              .foregroundStyle(.secondary)
                                      }
                                  }
                              }
                          }
                      }
                      .navigationTitle("MemForge")
                  }
              }

              private func firstScan() {
                  guard let value = Int32(query) else {
                      status = "Invalid Int32 value"
                      return
                  }
                  matches = memory.indices.filter { memory[$0] == value }
                  status = "Scan complete: \(matches.count) matches"
              }

              private func writeFirst() {
                  guard let index = matches.first else {
                      status = "No result selected"
                      return
                  }
                  memory[index] = 999999
                  status = memory[index] == 999999
                      ? "Write verified: 999999"
                      : "Write verification failed"
              }

              private func resetMemory() {
                  memory = Array(repeating: 0, count: 8192)
                  memory[128] = 1500
                  memory[512] = 1500
                  memory[1024] = 100
                  memory[2048] = 7500
                  query = "1500"
                  matches = []
                  status = "Memory reset"
              }
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d MemForgeV5.xcodeproj

      - name: Build for physical iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project MemForgeV5.xcodeproj \
            -scheme MemForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate and ad-hoc sign app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MemForge.app"
          test -d "$APP"
          test -f "$APP/Info.plist"

          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          TYPE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP/Info.plist")

          echo "Executable: $EXEC"
          echo "Bundle ID: $BUNDLE"
          echo "Package type: $TYPE"

          test "$TYPE" = "APPL"
          test -f "$APP/$EXEC"
          file "$APP/$EXEC"

          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP"

          /usr/bin/codesign --verify --verbose=4 "$APP"
          /usr/bin/codesign -dvv "$APP" 2>&1 | head -80

      - name: Create validated IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MemForge.app"

          rm -rf Payload ipa-check MemForge-V5.ipa
          mkdir -p Payload
          /usr/bin/ditto "$APP" "Payload/MemForge.app"
          /usr/bin/zip -qry MemForge-V5.ipa Payload

          test -s MemForge-V5.ipa
          unzip -t MemForge-V5.ipa

          mkdir ipa-check
          unzip -q MemForge-V5.ipa -d ipa-check
          test -d ipa-check/Payload/MemForge.app
          test -f ipa-check/Payload/MemForge.app/Info.plist

          EXEC=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            ipa-check/Payload/MemForge.app/Info.plist)

          test -f "ipa-check/Payload/MemForge.app/$EXEC"
          /usr/bin/codesign --verify --verbose=4 ipa-check/Payload/MemForge.app

          echo "IPA size:"
          ls -lh MemForge-V5.ipa

      - name: Upload MemForge V5
        uses: actions/upload-artifact@v4
        with:
          name: MemForge-V5-IPA
          path: MemForge-V5.ipa
          if-no-files-found: error
          retention-days: 7
