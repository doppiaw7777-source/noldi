name: MemForge V5 Auto Build

"on":
  push:
    paths:
      - ".github/workflows/memforge-v5.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create MemForge iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf MemForgeV5 MemForgeV5.xcodeproj build Payload MemForge-V5.ipa
          mkdir -p MemForgeV5

          cat > project.yml <<'YAML'
          name: MemForgeV5
          options:
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          targets:
            MemForge:
              type: application
              platform: iOS
              sources:
                - path: MemForgeV5
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.memforge.v5
                  PRODUCT_NAME: MemForge
                  INFOPLIST_FILE: MemForgeV5/Info.plist
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTS_MACCATALYST: "NO"
                  GENERATE_INFOPLIST_FILE: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
          YAML

          cat > MemForgeV5/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>it</string>
              <key>CFBundleDisplayName</key><string>MemForge</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>5.1</string>
              <key>CFBundleVersion</key><string>6</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          PLIST

          cat > MemForgeV5/MemForgeApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct MemForgeApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          SWIFT

          cat > MemForgeV5/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct DemoStat: Identifiable {
              let id = UUID()
              let name: String
              var value: Int
              var locked: Bool = false
          }

          struct ContentView: View {
              @State private var stats = [
                  DemoStat(name: "Coins", value: 1500),
                  DemoStat(name: "Gems", value: 25),
                  DemoStat(name: "Health", value: 100),
                  DemoStat(name: "Score", value: 7500)
              ]
              @State private var overlayOpen = false
              @State private var selectedIndex = 0
              @State private var editValue = "1500"
              @State private var gearOffset = CGSize(width: 0, height: 90)
              @State private var status = "Debug lab ready"

              var body: some View {
                  ZStack(alignment: .trailing) {
                      NavigationStack {
                          List {
                              Section {
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text("MemForge V5.1")
                                          .font(.title2.bold())
                                      Text("Controlled debug overlay")
                                          .foregroundStyle(.secondary)
                                      Text(status)
                                          .font(.caption.monospaced())
                                  }
                              }

                              Section("Demo game values") {
                                  ForEach(stats.indices, id: \.self) { i in
                                      HStack {
                                          Text(stats[i].name)
                                          Spacer()
                                          if stats[i].locked { Image(systemName: "lock.fill") }
                                          Text("\(stats[i].value)")
                                              .font(.body.monospacedDigit())
                                      }
                                  }
                              }

                              Section {
                                  Button("Simulate game update") {
                                      if !stats[0].locked { stats[0].value += 25 }
                                      if !stats[1].locked { stats[1].value += 1 }
                                      if !stats[2].locked { stats[2].value = max(0, stats[2].value - 5) }
                                      if !stats[3].locked { stats[3].value += 100 }
                                      status = "Demo values updated"
                                  }
                              }
                          }
                          .navigationTitle("MemForge")
                      }

                      Button {
                          overlayOpen.toggle()
                      } label: {
                          Image(systemName: overlayOpen ? "xmark" : "gearshape.fill")
                              .font(.title3.bold())
                              .foregroundStyle(.white)
                              .frame(width: 54, height: 54)
                              .background(.black.opacity(0.88), in: Circle())
                              .shadow(radius: 8)
                      }
                      .padding(.trailing, 12)
                      .offset(gearOffset)
                      .gesture(DragGesture().onChanged { gearOffset = $0.translation })
                      .zIndex(3)

                      if overlayOpen {
                          VStack(spacing: 14) {
                              HStack {
                                  Image(systemName: "gearshape.2.fill")
                                  Text("Debug Overlay").font(.headline)
                                  Spacer()
                              }

                              Picker("Value", selection: $selectedIndex) {
                                  ForEach(stats.indices, id: \.self) { i in
                                      Text(stats[i].name).tag(i)
                                  }
                              }
                              .onChange(of: selectedIndex) { _, newValue in
                                  editValue = String(stats[newValue].value)
                              }

                              HStack {
                                  Text("Current")
                                  Spacer()
                                  Text("\(stats[selectedIndex].value)")
                                      .font(.body.monospacedDigit())
                              }

                              TextField("New value", text: $editValue)
                                  .keyboardType(.numberPad)
                                  .textFieldStyle(.roundedBorder)

                              Button("Apply value") {
                                  if let n = Int(editValue) {
                                      stats[selectedIndex].value = n
                                      status = "Updated \(stats[selectedIndex].name)"
                                  }
                              }
                              .buttonStyle(.borderedProminent)

                              Toggle("Lock value", isOn: Binding(
                                  get: { stats[selectedIndex].locked },
                                  set: { stats[selectedIndex].locked = $0 }
                              ))

                              Text("Overlay active only inside this controlled demo app.")
                                  .font(.caption2)
                                  .foregroundStyle(.secondary)
                          }
                          .padding(18)
                          .frame(width: 320)
                          .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 24, style: .continuous))
                          .shadow(radius: 24)
                          .padding(.trailing, 22)
                          .transition(.scale.combined(with: .opacity))
                          .zIndex(2)
                      }
                  }
                  .animation(.spring(response: 0.28, dampingFraction: 0.82), value: overlayOpen)
              }
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d MemForgeV5.xcodeproj

      - name: Build for physical iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project MemForgeV5.xcodeproj \
            -scheme MemForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MemForge.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --verbose=4 "$APP"

      - name: Create IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MemForge.app"
          rm -rf Payload MemForge-V5.ipa
          mkdir -p Payload
          /usr/bin/ditto "$APP" "Payload/MemForge.app"
          /usr/bin/zip -qry MemForge-V5.ipa Payload
          test -s MemForge-V5.ipa
          unzip -t MemForge-V5.ipa

      - name: Upload MemForge V5
        uses: actions/upload-artifact@v4
        with:
          name: MemForge-V5-IPA
          path: MemForge-V5.ipa
          if-no-files-found: error
          retention-days: 7
