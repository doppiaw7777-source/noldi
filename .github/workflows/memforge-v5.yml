name: MemForgeKit GameHost Build

"on":
  push:
    paths:
      - "project.yml"
      - "MemForgeKit/**"
      - "GameHost/**"
      - ".github/workflows/memforge-v5.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d GameHost.xcodeproj

      - name: Build GameHost for physical iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project GameHost.xcodeproj \
            -scheme GameHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Ad-hoc sign embedded frameworks and app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/GameHost.app"
          test -d "$APP"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 | while IFS= read -r -d '' FW; do
              /usr/bin/codesign --force --sign - --timestamp=none "$FW"
            done
          fi
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Create validated IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/GameHost.app"
          rm -rf Payload ipa-check GameHost-MemForge.ipa
          mkdir -p Payload
          /usr/bin/ditto "$APP" "Payload/GameHost.app"
          /usr/bin/zip -qry GameHost-MemForge.ipa Payload
          test -s GameHost-MemForge.ipa
          unzip -t GameHost-MemForge.ipa
          mkdir ipa-check
          unzip -q GameHost-MemForge.ipa -d ipa-check
          test -d ipa-check/Payload/GameHost.app
          /usr/bin/codesign --verify --deep --strict --verbose=4 ipa-check/Payload/GameHost.app
          ls -lh GameHost-MemForge.ipa

      - name: Upload GameHost IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameHost-MemForge-IPA
          path: GameHost-MemForge.ipa
          if-no-files-found: error
          retention-days: 7
