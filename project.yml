name: GameHost
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MemForgeKit:
    type: framework
    platform: iOS
    sources:
      - path: MemForgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memforge.kit
        PRODUCT_NAME: MemForgeKit
        GENERATE_INFOPLIST_FILE: YES
  GameHost:
    type: application
    platform: iOS
    sources:
      - path: GameHost
    dependencies:
      - target: MemForgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memforge.gamehost
        PRODUCT_NAME: GameHost
        INFOPLIST_FILE: GameHost/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""